<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Clawd, the lobster, on a deep-navy tile. Square 512×512 source for every PWA
    icon: tools/icons.mjs renders it as-is (rounded tile) for icon-192/512, and
    with #bg made full-bleed plus #art scaled down for the maskable and Apple
    variants. Keep the ids: the renderer looks them up.
  -->
  <defs>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="1" stop-color="#0B1E2E"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFB088"/>
      <stop offset="0.45" stop-color="#E8825C"/>
      <stop offset="1" stop-color="#A8422F"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB088"/>
      <stop offset="0.55" stop-color="#E8825C"/>
      <stop offset="1" stop-color="#A8422F"/>
    </linearGradient>
  </defs>

  <rect id="bg" width="512" height="512" rx="112" fill="url(#tide)"/>

  <g id="art">
    <!-- tide line behind Clawd -->
    <path d="M40 418c40-22 72 8 112-10s64-26 104-4 68 22 104 0 64-18 112 6" fill="none" stroke="#7FE3D6" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

    <!-- antennae -->
    <path d="M214 160C190 118 156 100 118 96" fill="none" stroke="#E8825C" stroke-width="12" stroke-linecap="round"/>
    <path d="M298 160C322 118 356 100 394 96" fill="none" stroke="#E8825C" stroke-width="12" stroke-linecap="round"/>
    <circle cx="112" cy="94" r="12" fill="#FFB088"/>
    <circle cx="400" cy="94" r="12" fill="#FFB088"/>

    <!-- legs -->
    <g stroke="#C4553D" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M156 372l-24 44"/><path d="M196 386l-12 46"/>
      <path d="M356 372l24 44"/><path d="M316 386l12 46"/>
    </g>

    <!-- arms -->
    <g stroke="#C4553D" stroke-width="24" stroke-linecap="round" fill="none">
      <path d="M126 322L86 318"/>
      <path d="M386 322l40-4"/>
    </g>

    <!-- shell: superellipse -->
    <path d="M106 270C106 164.4 124 150 256 150C388 150 406 164.4 406 270C406 375.6 388 390 256 390C124 390 106 375.6 106 270Z" fill="url(#shell)"/>
    <ellipse cx="200" cy="196" rx="58" ry="24" transform="rotate(-18 200 196)" fill="#FFB088" opacity="0.6"/>

    <!-- pincers -->
    <g id="pincer-left">
      <ellipse cx="66" cy="318" rx="48" ry="40" fill="url(#claw)"/>
      <path d="M14 302L62 318L14 334Z" fill="#050A12"/>
    </g>
    <g id="pincer-right" transform="matrix(-1 0 0 1 512 0)">
      <ellipse cx="66" cy="318" rx="48" ry="40" fill="url(#claw)"/>
      <path d="M14 302L62 318L14 334Z" fill="#050A12"/>
    </g>

    <!-- eyes -->
    <circle cx="206" cy="264" r="32" fill="#FFFFFF"/>
    <circle cx="306" cy="264" r="32" fill="#FFFFFF"/>
    <circle cx="212" cy="268" r="16" fill="#1A1020"/>
    <circle cx="312" cy="268" r="16" fill="#1A1020"/>
    <circle cx="204" cy="258" r="5" fill="#FFFFFF"/>
    <circle cx="304" cy="258" r="5" fill="#FFFFFF"/>

    <!-- smile -->
    <path d="M232 322q24 18 48 0" fill="none" stroke="#A8422F" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
